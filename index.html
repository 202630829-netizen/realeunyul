<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100인의 연예인 초정밀 이상형 테스트</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .option-chip.active {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border-color: #c084fc;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            color: #ffffff;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 3px;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-3 sm:p-6 min-h-screen">

    <div id="app" class="w-full max-w-4xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-6 sm:mb-8">
            <span class="inline-block px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 mb-3">
                <i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i> 대한민국 남녀 연예인 100명 DB 탑재
            </span>
            <h1 class="text-2xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300">

            </h1>
            <p class="text-xs sm:text-sm text-slate-400 mt-2">

            </p>
        </header>

        <div id="intro-screen" class="glass-card rounded-3xl p-6 sm:p-10 text-center shadow-2xl relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-60 h-60 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -left-24 w-60 h-60 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <div class="my-6">
                <div class="inline-flex items-center justify-center w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-gradient-to-tr from-indigo-600 to-pink-500 text-white text-3xl sm:text-4xl shadow-lg shadow-indigo-500/30 mb-4">
                    <i class="fa-solid fa-heart-circle-check"></i>
                </div>
                <h2 class="text-xl sm:text-2xl font-bold text-white mb-2">원하는 성별 라인업을 선택하세요</h2>
                <p class="text-slate-300 text-xs sm:text-sm max-w-md mx-auto">
                    남성 연예인 50명, 여성 연예인 50명 중 당신의 라이프스타일과 외모/성격 취향에 100% 부합하는 연예인을 찾아드립니다.
                </p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-lg mx-auto mt-8">
                <button onclick="startTest('male')" class="p-5 rounded-2xl bg-slate-800/80 hover:bg-indigo-600/40 border border-slate-700 hover:border-indigo-500 transition-all duration-300 text-left group flex items-center justify-between">
                    <div>
                        <div class="text-indigo-400 font-bold text-base sm:text-lg group-hover:text-white">남성 연예인 50명</div>
                        <div class="text-xs text-slate-400">박보검, 차은우, 뷔, 변우석 등</div>
                    </div>
                    <i class="fa-solid fa-mars text-2xl text-indigo-400 group-hover:scale-110 transition-transform"></i>
                </button>
                <button onclick="startTest('female')" class="p-5 rounded-2xl bg-slate-800/80 hover:bg-pink-600/40 border border-slate-700 hover:border-pink-500 transition-all duration-300 text-left group flex items-center justify-between">
                    <div>
                        <div class="text-pink-400 font-bold text-base sm:text-lg group-hover:text-white">여성 연예인 50명</div>
                        <div class="text-xs text-slate-400">아이유, 카리나, 제니, 고윤정 등</div>
                    </div>
                    <i class="fa-solid fa-venus text-2xl text-pink-400 group-hover:scale-110 transition-transform"></i>
                </button>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden glass-card rounded-3xl p-5 sm:p-8 shadow-2xl relative">
            <!-- Progress Header -->
            <div class="mb-6">
                <div class="flex justify-between items-center text-xs sm:text-sm text-slate-300 mb-2">
                    <span id="step-indicator" class="font-bold text-indigo-400">Step 1 / 8</span>
                    <span id="step-title-header" class="text-slate-400">동물상 취향 (복수 선택 가능)</span>
                </div>
                <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden border border-slate-700">
                    <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full w-1/8 transition-all duration-300"></div>
                </div>
            </div>

            <!-- Dynamic Question Content -->
            <div id="question-container" class="min-h-[320px] flex flex-col justify-between">
                <!-- Content injected via JS -->
            </div>

            <!-- Step Control Buttons -->
            <div class="flex justify-between items-center mt-8 pt-4 border-t border-slate-800">
                <button id="prev-btn" onclick="prevStep()" class="px-5 py-2.5 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs sm:text-sm font-semibold transition-all flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> 이전 Step
                </button>
                <button id="next-btn" onclick="nextStep()" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-xs sm:text-sm font-bold hover:shadow-lg hover:shadow-indigo-500/30 transition-all flex items-center gap-2">
                    다음 Step <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- Result Loading Screen -->

            <h3 class="text-xl font-bold text-white mb-2">100명의 연예인 DB 매칭 분석 중...</h3>

        </div>

        <!-- Result View Screen -->
        <div id="result-screen" class="hidden space-y-6">
            <div id="result-card-container"></div>
            <div class="text-center">
                <button onclick="restartTest()" class="px-8 py-3.5 rounded-2xl bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-white font-bold text-sm sm:text-base shadow-xl hover:scale-105 transition-all">

                </button>
            </div>
        </div>
    </div>

        function renderStep() {

            document.getElementById('step-indicator').innerText = `Step ${state.currentStep + 1} / ${QUIZ_STEPS.length}`;

            // Prev button visibility
            document.getElementById('prev-btn').style.visibility = state.currentStep === 0 ? 'hidden' : 'visible';

            // Next button text
            const nextBtn = document.getElementById('next-btn');
            if (state.currentStep === QUIZ_STEPS.length - 1) {
                nextBtn.innerHTML = '결과 분석하기 <i class="fa-solid fa-square-poll-vertical"></i>';

                nextBtn.innerHTML = '다음 Step <i class="fa-solid fa-arrow-right"></i>';

            if (isMulti) {
                if (!state.answers[stepId]) state.answers[stepId] = [];

                if (idx > -1) {
                    state.answers[stepId].splice(idx, 1);
                } else {
                    state.answers[stepId].push(val);
                }
            } else {
                state.answers[stepId] = val;

            renderStep();

        /* ==========================================================================
           8-STEP WEIGHED MATCHING ALGORITHM
           ========================================================================== */
        function calculateResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');

            setTimeout(() => {
                const candidates = CELEBRITIES[state.gender];
                let bestMatch = null;
                let highestScore = -1;

                candidates.forEach(celeb => {
                    let score = 0;

                    // 1. Animal Face Weight (Multi-matching)
                    const selAnimals = state.answers['animal'] || [];
                    selAnimals.forEach(a => {
                        if (celeb.animal.includes(a)) {
                            score += 25; // High weight for animal face match
                        }
                    });

                    // 2. Physical Style Match
                    const selPhys = state.answers['physical'];
                    if (selPhys === 'tall' && parseInt(celeb.height) >= 183) score += 15;
                    if (selPhys === 'cute_height' && parseInt(celeb.height) < 180) score += 15;

                    // 3. Style Match
                    if (state.answers['style'] === celeb.style) score += 20;

                    // 4. Personality Traits Match
                    const selPers = state.answers['personality'] || [];
                    selPers.forEach(p => {
                        if (celeb.personality.includes(p)) score += 10;
                    });

                    // Random subtle variation for natural ranking spread
                    score += Math.floor(Math.random() * 5);

                    if (score > highestScore) {
                        highestScore = score;
                        bestMatch = celeb;
                    }
                });

                document.getElementById('loading-screen').classList.add('hidden');
                renderResult(bestMatch);
            }, 1200);
        }

                    <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
                        <!-- Left Avatar Image Card -->
                        <div class="md:col-span-5 flex flex-col items-center">
                            <div class="w-full max-w-[280px] aspect-[5/6] rounded-2xl overflow-hidden shadow-2xl border-2 border-indigo-400/30">
                                <img src="${avatarSvgData}" alt="${celeb.name}" class="w-full h-full object-cover">
                            </div>
                            <div class="mt-4 flex flex-wrap gap-2 justify-center">
                                ${celeb.animal.map(a => `<span class="px-3 py-1 rounded-lg bg-indigo-900/60 text-indigo-200 text-xs font-semibold border border-indigo-700/50">#${a}상</span>`).join('')}
                                <span class="px-3 py-1 rounded-lg bg-purple-900/60 text-purple-200 text-xs font-semibold border border-purple-700/50">#${celeb.height}</span>
                            </div>
                        </div>

                        <!-- Right Namuwiki Style Detailed Analysis -->
                        <div class="md:col-span-7 space-y-4">
                            <!-- Namuwiki Style Table -->
                            <div class="rounded-2xl border border-slate-700/80 overflow-hidden bg-slate-900/80 text-xs sm:text-sm">
                                <div class="bg-indigo-950/80 px-4 py-2.5 font-bold text-indigo-200 border-b border-slate-700 flex items-center gap-2">
                                    <i class="fa-solid fa-book-bookmark text-indigo-400"></i> 나무위키 스타일 상세 데이터 프로필
                                </div>
                                <div class="divide-y divide-slate-800">
                                    <div class="grid grid-cols-3 p-3">
                                        <div class="font-bold text-slate-400">이름</div>
                                        <div class="col-span-2 text-white font-semibold">${celeb.name}</div>
                                    </div>
                                    <div class="grid grid-cols-3 p-3">
                                        <div class="font-bold text-slate-400">신장 (피지컬)</div>
                                        <div class="col-span-2 text-slate-200">${celeb.height}</div>
                                    </div>
                                    <div class="grid grid-cols-3 p-3">
                                        <div class="font-bold text-slate-400">페이스 분류</div>
                                        <div class="col-span-2 text-slate-200">${celeb.animal.join(', ')} 동물상 대표</div>
                                    </div>
                                    <div class="grid grid-cols-3 p-3">
                                        <div class="font-bold text-slate-400">대표 스타일</div>
                                        <div class="col-span-2 text-slate-200">${celeb.style.toUpperCase()} 감성</div>
                                    </div>
                                    <div class="grid grid-cols-3 p-3">
                                        <div class="font-bold text-slate-400">주요 취미</div>
                                        <div class="col-span-2 text-slate-200">${celeb.hobby.join(', ')}</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Detailed Namuwiki Trait Text -->
                            <div class="p-5 rounded-2xl bg-indigo-950/40 border border-indigo-800/40 space-y-2">
                                <h4 class="font-bold text-indigo-300 text-sm flex items-center gap-1.5">
                                    <i class="fa-solid fa-magnifying-glass"></i> 외모 및 성격 종합 상세 분석
                                </h4>
                                <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">
                                    ${celeb.traits}
                                </p>
                            </div>

                            <div class="p-4 rounded-2xl bg-slate-800/50 border border-slate-700/60 text-xs text-slate-400">
                                <i class="fa-solid fa-circle-check text-indigo-400 mr-1"></i>
                                선택하신 <strong>${QUIZ_STEPS.length}단계 다각도 선택 조건</strong>과 연예인의 라이프스타일, 외모 수치가 유의미하게 일치하여 도출된 최적의 조합입니다.
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function restartTest() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
